name: 构建并发布 APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
          cache: true

      - name: 补齐 Android SDK 组件
        run: |
          set -e
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: 拉取依赖
        run: flutter pub get

      - name: 准备签名证书（配置了 Secret 才启用）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/abts-release.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=abts-release.jks
          EOF
            echo "已启用正式签名"
          else
            echo "未配置签名 Secret，使用 debug 签名构建（可安装，但与正式包不通用）"
          fi

      - name: 构建按架构分包 APK
        run: flutter build apk --release --split-per-abi

      - name: 整理产物
        id: dist
        run: |
          set -e
          mkdir -p dist
          VER="${GITHUB_REF_NAME#v}"
          [ -n "$VER" ] || VER="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          for f in build/app/outputs/flutter-apk/*.apk; do
            base="$(basename "$f" .apk)"
            abi="${base%-release}"
            abi="${abi#app-}"
            cp "$f" "dist/abts-v${VER}-${abi}.apk"
          done
          ls -lh dist

      - name: 上传构建产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: abts-apks
          path: dist/*.apk
          retention-days: 7

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 阿B听书 ${{ github.ref_name }}
          body: |
            ## 更新内容
            - 新增**播放倍速**：0.5× ~ 3.0×（变速不变调），播放页「倍速」与设置页均可切换
            - 倍速本地记忆，切换章节与重启应用后保持
            - 系统媒体会话（通知栏 / 锁屏）同步倍速状态

            ## 下载
            | 安装包 | 适用设备 |
            | --- | --- |
            | `abts-${{ github.ref_name }}-arm64-v8a.apk` | 绝大多数手机（2017 年后的主流安卓机） |
            | `abts-${{ github.ref_name }}-armeabi-v7a.apk` | 较老的 32 位手机 / 低端设备 |
            | `abts-${{ github.ref_name }}-x86_64.apk` | x86_64 模拟器 / 平板 / 盒子 |

            安装即可，包名 `dev.pages.abts`，Android 7.0+。
          files: dist/*.apk
